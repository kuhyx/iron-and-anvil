# Mirrors the local gate exactly, so green-local means green-CI:
#   pnpm run lint      -> eslint .
#   pnpm run typecheck -> tsc --noEmit
#   pnpm run test:cov  -> vitest, which fails below 100% coverage
#   pnpm run build     -> tsc --noEmit && vite build
#   tools/web_smoke.py -> the build boots in headless Chromium (itch.io)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors outright when
      # it is given one AND package.json declares `packageManager`, and the
      # manifest is the right single source: it is what corepack, local
      # installs and the dependency-freshness gate all read.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      # --frozen-lockfile: fails on a lockfile that does not match
      # package.json rather than silently resolving something else.
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Shellcheck install.sh, run.sh and tools/publish_itch.sh
        run: shellcheck install.sh run.sh tools/publish_itch.sh

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests + 100% coverage
        run: pnpm run test:cov

      - name: Build
        run: pnpm run build

      # The itch.io build: dist/ must boot in a real browser and react to a
      # click (relative asset paths, no runtime errors). Same script as
      # tools/publish_itch.sh runs before every push to itch.
      - name: Web smoke test (headless Chromium)
        run: |
          python3 -m venv .smoke
          .smoke/bin/pip install --quiet playwright
          .smoke/bin/python -m playwright install --with-deps chromium
          .smoke/bin/python tools/web_smoke.py dist --selector '#root button' --seconds 4
